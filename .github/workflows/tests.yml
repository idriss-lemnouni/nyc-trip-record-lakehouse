name: Tests

on: [push, pull_request]

jobs:
  manifest-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: mkdir -p runs
      - run: docker compose run --rm -T spark --master 'local[2]' --driver-memory 768m --conf spark.ui.enabled=false tests/check_spark.py
